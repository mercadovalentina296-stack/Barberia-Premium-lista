<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Crear cuenta | Barbería Premium</title><link rel="stylesheet" href="css/styles.css"><script defer src="js/api.js"></script><script defer src="js/main.js"></script></head>
<body><header class="site-header"><div class="container nav-wrap"><a class="brand" href="index.html">BARBERÍA PREMIUM</a><a class="btn btn-small btn-outline" href="index.html">Volver al inicio</a></div></header>
<main class="form-shell"><h1>Crear cuenta</h1><p>Registrate para poder reservar y consultar tus turnos.</p>
<form class="form-grid" id="register-form">
<div class="field"><label for="nombre">Nombre completo</label><input id="nombre" name="nombre" autocomplete="name" required></div>
<div class="field"><label for="email">Correo electrónico</label><input id="email" name="email" type="email" autocomplete="email" required></div>
<div class="field"><label for="telefono">Teléfono</label><input id="telefono" name="telefono" type="tel" autocomplete="tel" required></div>
<div class="field"><label for="password">Contraseña</label><input id="password" name="password" type="password" minlength="8" autocomplete="new-password" required></div>
<button class="btn" type="submit">Crear cuenta</button><div id="form-message" class="form-message" role="status"></div>
</form><p class="form-note">¿Ya tenés una cuenta? <a href="inicioSesion.html">Iniciá sesión</a>.</p></main>
<footer class="site-footer"><div class="container">© <span data-current-year>2026</span> Barbería Premium</div></footer></body></html>
