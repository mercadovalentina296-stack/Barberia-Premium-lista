<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reservar turno | Barbería Premium</title>
<link rel="stylesheet" href="css/styles.css">
<script defer src="js/api.js"></script><script defer src="js/main.js"></script>
</head>
<body>
<header class="site-header"><div class="container nav-wrap">
<a class="brand" href="index.html">BARBERÍA PREMIUM</a>
<nav class="nav-links"><a href="index.html">Inicio</a><a href="reservas.html">Reservar</a><a href="misReserva.html">Mis reservas</a><a href="inicioSesion.html">Ingresar</a></nav>
</div></header>
<main class="form-shell">
<h1>Reservar turno</h1><p>Elegí el servicio, la fecha y el horario que preferís.</p>
<form class="form-grid" id="booking-form">
<div class="field"><label for="service">Servicio</label><select id="service" name="service" required><option value="">Cargando servicios...</option></select></div>
<div class="field"><label for="date">Fecha</label><input id="date" name="date" type="date" required></div>
<div class="field"><label for="time">Horario</label><select id="time" name="time" required>
<option value="">Seleccionar horario</option><option value="09:00">09:00</option><option value="10:00">10:00</option><option value="11:00">11:00</option><option value="12:00">12:00</option><option value="13:00">13:00</option><option value="14:00">14:00</option><option value="15:00">15:00</option><option value="16:00">16:00</option><option value="17:00">17:00</option>
</select></div>
<button class="btn" type="submit">Solicitar turno</button><div id="form-message" class="form-message" role="status"></div>
</form><p class="form-note">Para reservar necesitás iniciar sesión. Si todavía no tenés cuenta, <a href="registro.html">registrate acá</a>.</p>
</main><footer class="site-footer"><div class="container">© <span data-current-year>2026</span> Barbería Premium</div></footer>
</body></html>
