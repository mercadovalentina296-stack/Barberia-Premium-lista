<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Iniciar sesión | Barbería Premium</title><link rel="stylesheet" href="css/styles.css"><script defer src="js/api.js"></script><script defer src="js/main.js"></script></head>
<body><header class="site-header"><div class="container nav-wrap"><a class="brand" href="index.html">BARBERÍA PREMIUM</a><a class="btn btn-small btn-outline" href="index.html">Volver al inicio</a></div></header>
<main class="form-shell"><h1>Iniciar sesión</h1><p>Ingresá a tu cuenta para administrar tus reservas.</p>
<form class="form-grid" id="login-form">
<div class="field"><label for="email">Correo electrónico</label><input id="email" name="email" type="email" autocomplete="email" required></div>
<div class="field"><label for="password">Contraseña</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
<button class="btn" type="submit">Ingresar</button><div id="form-message" class="form-message" role="status"></div>
</form><p class="form-note">¿Todavía no tenés cuenta? <a href="registro.html">Registrate</a>.</p></main>
<footer class="site-footer"><div class="container">© <span data-current-year>2026</span> Barbería Premium</div></footer></body></html>
